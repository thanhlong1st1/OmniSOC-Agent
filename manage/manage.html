body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(135deg,rgba(10,6,32,.82) 0%,rgba(20,12,50,.7) 30%,rgba(15,10,40,.6) 60%,rgba(25,15,55,.75) 100%);
}
body>*{position:relative;z-index:1}
a{color:var(--accent);text-decoration:none}
input,textarea,select,button{font:inherit;color:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--subtle);border-radius:3px}

/* Utility */
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
.mono{font-family:'SF Mono','Fira Code',monospace;font-size:12.5px}

/* Inputs */
.input,.textarea,.select{
  width:100%;background:rgba(10,8,30,.5);border:1px solid var(--glass-border);border-radius:var(--radius-sm);
  padding:8px 12px;color:var(--fg);outline:none;transition:all .15s;
  backdrop-filter:blur(4px);
}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
.textarea{resize:vertical;min-height:80px}
.select{cursor:pointer;appearance:auto}
.label{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.5px}
.hint{font-size:11px;color:var(--subtle);margin-top:2px}
.field{margin-bottom:16px}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid var(--glass-border);
  border-radius:var(--radius-sm);background:rgba(25,20,60,.5);color:var(--fg);cursor:pointer;
  font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap;
  backdrop-filter:blur(6px);
}
.btn:hover{border-color:rgba(124,154,255,.35);background:rgba(40,30,80,.6)}
.btn-primary{background:linear-gradient(135deg,#6366f1,#818cf8);border-color:rgba(129,140,248,.4);color:#fff;font-weight:600}
.btn-primary:hover{opacity:.9;box-shadow:0 0 16px rgba(99,102,241,.3)}
.btn-danger{border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-icon{padding:6px;border:none;background:transparent;color:var(--muted);cursor:pointer}
.btn-icon:hover{color:var(--fg)}

/* Toggle */
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.toggle input{display:none}
.toggle-track{width:36px;height:20px;background:rgba(60,50,100,.5);border-radius:10px;position:relative;transition:background .2s}
.toggle input:checked+.toggle-track{background:linear-gradient(135deg,#6366f1,#818cf8)}
.toggle-track::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle input:checked+.toggle-track::after{transform:translateX(16px)}

/* Badges */
.badge{
  display:inline-flex;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;
  text-transform:uppercase;letter-spacing:.3px;
}
.badge-tier{background:rgba(99,102,241,.18);color:#a5b4fc}
.badge-cat{background:rgba(129,140,248,.12);color:var(--info)}
.badge-builtin{background:rgba(34,197,94,.12);color:var(--success)}
.badge-custom{background:rgba(234,179,8,.12);color:var(--warn)}

/* Card */
.card{
  background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 4px 24px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.05);
}
.card-header{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}

/* Topbar */
.topbar{
  display:flex;align-items:center;gap:24px;padding:0 24px;height:52px;
  background:rgba(12,8,35,.7);border-bottom:1px solid var(--glass-border);flex-shrink:0;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 2px 16px rgba(0,0,0,.3);
}
.topbar-title{font-size:16px;font-weight:700;color:var(--accent);white-space:nowrap}
.topbar-nav{display:flex;gap:4px}
.topbar-nav button{
  padding:6px 14px;border:none;background:transparent;color:var(--muted);cursor:pointer;
  border-radius:var(--radius-sm);font-weight:500;font-size:13px;transition:all .15s;
}
.topbar-nav button:hover{color:var(--fg);background:var(--card2)}
.topbar-nav button.active{color:#fff;background:linear-gradient(135deg,rgba(99,102,241,.35),rgba(129,140,248,.25));border:1px solid rgba(129,140,248,.3)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}

/* Login */
.login-wrap{display:flex;align-items:center;justify-content:center;flex:1}
.login-box{
  width:360px;padding:32px;background:rgba(15,10,40,.6);border:1px solid var(--glass-border);border-radius:16px;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  box-shadow:0 8px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);
}
.login-box h2{text-align:center;margin-bottom:24px;font-size:20px}
.login-box .field{margin-bottom:16px}
.login-err{color:var(--danger);font-size:12px;text-align:center;margin-top:8px;min-height:18px}

/* Agent list */
.agent-layout{display:flex;flex:1;overflow:hidden}
.agent-sidebar{
  width:280px;flex-shrink:0;border-right:1px solid var(--glass-border);overflow-y:auto;padding:12px;
  background:rgba(10,8,30,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.agent-main{flex:1;overflow-y:auto;padding:24px;background:rgba(8,5,25,.3)}
.agent-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);
  cursor:pointer;transition:background .15s;margin-bottom:2px;
}
.agent-item:hover{background:rgba(99,102,241,.1)}
.agent-item.active{background:rgba(99,102,241,.18);border:1px solid rgba(129,140,248,.3)}
.agent-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.agent-item-info{min-width:0;flex:1}
.agent-item-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-item-meta{font-size:11px;color:var(--muted)}

/* Section headers in editor */
.section-title{
  font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;
  color:#a5b4fc;margin:24px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--glass-border);
}
.section-title:first-child{margin-top:0}

/* Responsibility list */
.resp-list{display:flex;flex-direction:column;gap:6px}
.resp-row{display:flex;gap:6px;align-items:center}
.resp-row .input{flex:1}

/* Tool list */
.tool-row{
  display:flex;align-items:center;justify-content:space-between;padding:6px 10px;
  border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:4px;
}
.tool-row .mono{flex:1}

/* Checkbox grid */
.check-grid{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow-y:auto;padding-right:4px}
.check-item{
  display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border:1px solid var(--line);
  border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;
}
.check-item:hover{border-color:var(--subtle)}
.check-item.checked{border-color:rgba(129,140,248,.4);background:rgba(99,102,241,.12)}
.check-item input{margin-top:2px;accent-color:var(--accent)}
.check-item-info{min-width:0;flex:1}
.check-item-name{font-size:13px;font-weight:500}
.check-item-desc{font-size:11px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Sticky save bar */
.save-bar{
  position:sticky;bottom:0;background:rgba(12,8,35,.8);border-top:1px solid var(--glass-border);
  padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin:24px -24px -24px;z-index:10;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.save-bar .muted{font-size:12px}

/* Skills grid */
.skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.skill-card{cursor:pointer;transition:border-color .15s}
.skill-card:hover{border-color:var(--subtle)}
.skill-card-title{font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.skill-card-desc{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.skill-card-footer{display:flex;gap:8px;margin-top:8px;align-items:center}

/* Skills filter bar */
.filter-bar{display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.filter-bar .input{max-width:280px}

/* Preview */
.preview-wrap{max-width:900px}
.preview-prompt{
  background:rgba(8,5,25,.6);border:1px solid var(--glass-border);border-radius:var(--radius);
  padding:20px;font-family:'SF Mono','Fira Code',monospace;font-size:12px;
  white-space:pre-wrap;word-break:break-word;line-height:1.7;max-height:70vh;overflow-y:auto;
  color:rgba(232,230,240,.85);backdrop-filter:blur(8px);
}
.preview-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{
  display:inline-flex;padding:4px 10px;border:1px solid var(--glass-border);border-radius:var(--radius-sm);
  font-size:12px;background:rgba(99,102,241,.1);
}

/* Toast */
.toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{
  padding:10px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;
  animation:toastIn .3s ease;min-width:240px;display:flex;align-items:center;gap:8px;
  box-shadow:0 4px 20px rgba(0,0,0,.5);backdrop-filter:blur(16px);
}
.toast-success{background:rgba(22,101,52,.85);color:#bbf7d0;border:1px solid rgba(34,197,94,.5)}
.toast-error{background:rgba(127,29,29,.85);color:#fecaca;border:1px solid rgba(239,68,68,.5)}
.toast-info{background:rgba(30,58,95,.85);color:#bfdbfe;border:1px solid rgba(129,140,248,.5)}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

/* Autocomplete for color */
input[type="color"]{width:48px;height:32px;padding:2px;border:1px solid var(--glass-border);border-radius:6px;background:rgba(10,8,30,.5);cursor:pointer}

/* Radio group */
.radio-group{display:flex;gap:6px;flex-wrap:wrap}
.radio-group label{
  display:inline-flex;padding:6px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);
  cursor:pointer;font-size:13px;transition:all .15s;
}
.radio-group label:hover{border-color:var(--subtle)}
.radio-group input{display:none}
.radio-group input:checked+span{color:var(--accent)}
.radio-group label:has(input:checked){border-color:rgba(129,140,248,.5);background:rgba(99,102,241,.15)}

/* Password field */
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:36px}
.pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px}

/* Loader */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(99,102,241,.25);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-full{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--muted)}

/* Empty state */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty p{margin-top:8px;font-size:13px}

/* Skill editor panel */
.skill-editor-panel{max-width:800px}
</style>
</head>
<body>

<div class="toast-container" id="toasts"></div>

<!-- Login -->
<div id="login-screen" class="login-wrap">
  <div class="login-box">
    <h2 style="color:#a5b4fc">🔐 OmniSOC Manager</h2>
    <div class="field">
      <label class="label">Email</label>
      <input class="input" id="login-email" type="email" value="admin@autopilot.local">
    </div>
    <div class="field">
      <label class="label">Password</label>
      <input class="input" id="login-pw" type="password" placeholder="Password">
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" id="login-btn">Sign in</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- Main app (hidden until logged in) -->
<div id="app-shell" class="hidden" style="display:flex;flex-direction:column;flex:1">
  <div class="topbar">
    <div class="topbar-title">⚡ OmniSOC Manager</div>
    <div class="topbar-nav" id="main-tabs">
      <button class="active" data-tab="agents">Agents</button>
      <button data-tab="skills">Skills Library</button>
      <button data-tab="preview">Prompt Preview</button>
    </div>
    <div class="topbar-right">
      <span class="muted small" id="user-label"></span>
      <button class="btn btn-sm" id="back-to-ui" onclick="window.location.href='/'">← Back to UI</button>
      <button class="btn btn-sm" id="logout-btn">Logout</button>
    </div>
  </div>

  <!-- Tab: Agents -->
  <div id="tab-agents" class="agent-layout" style="flex:1">
    <div class="agent-sidebar" id="agent-sidebar">
      <div style="margin-bottom:8px;font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Agents</div>
      <div id="agent-list"></div>
    </div>
    <div class="agent-main" id="agent-main">
      <div class="empty" id="agent-empty">
        <div style="font-size:28px">👈</div>
        <p>Select an agent from the sidebar to edit</p>
      </div>
      <div id="agent-editor" class="hidden"></div>
    </div>
  </div>

  <!-- Tab: Skills -->
  <div id="tab-skills" class="hidden" style="flex:1;overflow-y:auto;padding:24px">
    <div class="filter-bar">
      <input class="input" id="skill-search" placeholder="Search skills...">
      <button class="btn btn-primary" id="skill-create-btn">+ Create Skill</button>
    </div>
    <div id="skills-content">
      <div class="skills-grid" id="skills-grid"></div>
    </div>
    <div id="skill-editor-wrap" class="hidden skill-editor-panel"></div>
  </div>

  <!-- Tab: Preview -->
  <div id="tab-preview" class="hidden" style="flex:1;overflow-y:auto;padding:24px">
    <div class="preview-wrap">
      <div class="field">
        <label class="label">Select Agent</label>
        <select class="select" id="preview-agent" style="max-width:320px"></select>
      </div>
      <div id="preview-content"></div>
    </div>
  </div>
</div>

<script>
const API = '/api/v1';
let token = null;
let agents = [];
let allSkills = [];
let platformModel = {};
let currentAgentId = null;

// ── Auth ──────────────────────────────────────────────────
function getToken(){ try { return sessionStorage.getItem('ap_mgr_token'); } catch(e){return null;} }
function setToken(t){ token=t; try { sessionStorage.setItem('ap_mgr_token',t); } catch(e){} }
function clearToken(){ token=null; try { sessionStorage.removeItem('ap_mgr_token'); } catch(e){} }

async function apiFetch(path, opts={}){
  const headers = {'Content-Type':'application/json',...(opts.headers||{})};
  if(token) headers['Authorization'] = 'Bearer '+token;
  const res = await fetch(API+path,{...opts, headers});
  if(res.status===401){ clearToken(); showLogin(); throw new Error('Unauthorized'); }
  if(!res.ok){
    const err = await res.json().catch(()=>({detail:res.statusText}));
    throw new Error(err.detail||'Request failed');
  }
  return res.json();
}

// ── Toast ─────────────────────────────────────────────────
function toast(msg, type='success'){
  const el = document.createElement('div');
  el.className='toast toast-'+type;
  el.textContent=msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(), 3500);
}

// ── Login ─────────────────────────────────────────────────
function showLogin(){
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('app-shell').classList.add('hidden');
  document.getElementById('app-shell').style.display='none';
}
function showApp(){
  document.getElementById('login-screen').classList.add('hidden');
  const shell = document.getElementById('app-shell');
  shell.classList.remove('hidden');
  shell.style.display='flex';
}

document.getElementById('login-btn').onclick = async ()=>{
  const email = document.getElementById('login-email').value;
  const pw = document.getElementById('login-pw').value;
  const errEl = document.getElementById('login-err');
  errEl.textContent='';
  try {
    const data = await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})}).then(r=>r.json());
    if(!data.access_token) throw new Error(data.detail||'Login failed');
    setToken(data.access_token);
    document.getElementById('user-label').textContent = data.user?.name || email;
    showApp();
    loadAll();
  } catch(e){ errEl.textContent=e.message; }
};
document.getElementById('login-pw').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('login-btn').click()});
document.getElementById('logout-btn').onclick = ()=>{ clearToken(); showLogin(); };

// ── Tabs ──────────────────────────────────────────────────
const tabMap = {agents:'tab-agents', skills:'tab-skills', preview:'tab-preview'};
document.getElementById('main-tabs').addEventListener('click',e=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  const tab = btn.dataset.tab;
  document.querySelectorAll('#main-tabs button').forEach(b=>b.classList.toggle('active',b===btn));
  Object.entries(tabMap).forEach(([k,id])=>{
    const el = document.getElementById(id);
    if(k===tab){el.classList.remove('hidden');el.style.display=k==='agents'?'flex':'block';}
    else{el.classList.add('hidden');el.style.display='none';}
  });
  if(tab==='skills') renderSkills();
  if(tab==='preview') renderPreviewSelector();
});

// ── Data loading ──────────────────────────────────────────
async function loadAll(){
  try {
    const [agData, skData, settings] = await Promise.all([
      apiFetch('/agents'),
      apiFetch('/skills'),
      apiFetch('/settings').catch(()=>({}))
    ]);
    agents = agData.items || [];
    allSkills = skData.items || [];
    platformModel = settings.model || {};
    renderAgentList();
  } catch(e){ toast(e.message,'error'); }
}

// ── Agent List (sidebar) ──────────────────────────────────
function renderAgentList(){
  const el = document.getElementById('agent-list');
  el.innerHTML = agents.map(a=>`
    <div class="agent-item ${a.id===currentAgentId?'active':''}" data-id="${a.id}">
      <div class="agent-dot" style="background:${a.avatar_color||'#888'}"></div>
      <div class="agent-item-info">
        <div class="agent-item-name">${esc(a.name)}</div>
        <div class="agent-item-meta">${esc(a.codename)} · <span class="badge badge-tier" style="font-size:9px;padding:1px 5px">${a.tier}</span></div>
      </div>
    </div>
  `).join('');
  el.querySelectorAll('.agent-item').forEach(item=>{
    item.onclick = ()=> loadAgent(item.dataset.id);
  });
}

// ── Agent Editor ──────────────────────────────────────────
async function loadAgent(id){
  currentAgentId = id;
  renderAgentList();
  const main = document.getElementById('agent-main');
  const editor = document.getElementById('agent-editor');
  const empty = document.getElementById('agent-empty');
  empty.classList.add('hidden');
  editor.classList.remove('hidden');
  editor.innerHTML = '<div class="loading-full"><div class="spinner"></div>&nbsp; Loading...</div>';
  try {
    const a = await apiFetch('/agents/'+id);
    renderAgentEditor(a);
  } catch(e){ editor.innerHTML='<div class="empty"><p>Error: '+esc(e.message)+'</p></div>'; }
}

function renderAgentEditor(a){
  const ed = document.getElementById('agent-editor');
  const hasOverride = a.model && !a.model.inherited;
  const mo = hasOverride ? (agents.find(x=>x.id===a.id)||{}) : {};
  // We need the raw model_override from the agent. The API doesn't return it directly in GET /agents/{id}.
  // model.provider / model.model_id are resolved. model.inherited tells us if override exists.
  // For editing, we reconstruct from what's visible.

  ed.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <div class="agent-dot" style="width:18px;height:18px;background:${a.avatar_color||'#888'}"></div>
      <div>
        <h2 style="font-size:20px;font-weight:600">${esc(a.name)}</h2>
        <div class="muted small">${esc(a.codename)} · ${a.tier} · ${a.category}</div>
      </div>
    </div>

    <div class="section-title">Profile</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="field"><label class="label">Name (EN)</label><input class="input" id="ed-name" value="${esc(a.name_en||'')}"></div>
      <div class="field"><label class="label">Name (VI)</label><input class="input" id="ed-name-vi" value="${esc(a.name||'')}"></div>
      <div class="field"><label class="label">Codename</label><input class="input" id="ed-codename" value="${esc(a.codename)}"></div>
      <div class="field" style="display:flex;gap:12px;align-items:flex-end">
        <div style="flex:1"><label class="label">Icon</label><input class="input" id="ed-icon" value="${esc(a.icon||'')}"></div>
        <div><label class="label">Color</label><input type="color" id="ed-color" value="${a.avatar_color||'#888888'}"></div>
      </div>
    </div>
    <div class="field"><label class="label">Description</label><textarea class="textarea" id="ed-desc" rows="2">${esc(a.description||'')}</textarea></div>
    <div class="field"><label class="label">Persona</label><textarea class="textarea" id="ed-persona" rows="4">${esc(a.persona||'')}</textarea></div>
    <div class="field">
      <label class="label">Responsibilities</label>
      <div class="resp-list" id="ed-resp"></div>
      <button class="btn btn-sm" style="margin-top:6px" id="ed-resp-add">+ Add</button>
    </div>

    <div class="section-title">Model & API</div>
    <div style="margin-bottom:12px;padding:10px 12px;background:var(--deep);border-radius:var(--radius-sm);font-size:12px;color:var(--muted)">
      Platform default: <strong style="color:var(--fg)">${esc(platformModel.provider||'—')} / ${esc(platformModel.model_id||'—')}</strong>
    </div>
    <label class="toggle" style="margin-bottom:12px">
      <input type="checkbox" id="ed-model-override" ${hasOverride?'checked':''}>
      <div class="toggle-track"></div>
      <span style="font-size:13px">Override platform model for this agent</span>
    </label>
    <div id="ed-model-fields" class="${hasOverride?'':'hidden'}">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field"><label class="label">Provider</label>
          <select class="select" id="ed-provider">
            <option value="litellm">LiteLLM</option><option value="bedrock">AWS Bedrock</option>
            <option value="anthropic">Anthropic</option><option value="openai">OpenAI</option>
            <option value="deepseek">DeepSeek</option><option value="custom">Custom</option>
          </select>
        </div>
        <div class="field"><label class="label">Model ID</label><input class="input mono" id="ed-model-id" placeholder="e.g. deepseek/deepseek-chat"></div>
        <div class="field"><label class="label">API Key</label>
          <div class="pw-wrap">
            <input class="input mono" id="ed-api-key" type="password" placeholder="sk-...">
            <button class="pw-toggle" onclick="togglePw('ed-api-key',this)">show</button>
          </div>
          <div class="hint">Leave empty to use platform key</div>
        </div>
        <div class="field"><label class="label">Base URL</label><input class="input mono" id="ed-base-url" placeholder="https://..."></div>
      </div>
    </div>

    <div class="section-title">Configuration</div>
    <label class="toggle" style="margin-bottom:12px">
      <input type="checkbox" id="ed-enabled" ${a.enabled?'checked':''}>
      <div class="toggle-track"></div>
      <span style="font-size:13px">${a.enabled?'Agent enabled':'Agent disabled'}</span>
    </label>
    <div class="field">
      <label class="label">Autonomy Cap</label>
      <div class="radio-group" id="ed-autonomy">
        ${['observe','recommend','supervised','autonomous'].map(v=>`<label><input type="radio" name="autonomy" value="${v}" ${a.autonomy_cap===v?'checked':''}><span>${v}</span></label>`).join('')}
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="field"><label class="label">Temperature</label><input class="input" id="ed-temp" type="number" min="0" max="2" step="0.1" value="${a.temperature??''}"></div>
      <div class="field"><label class="label">Max Tokens</label><input class="input" id="ed-max-tok" type="number" value="${a.max_tokens??''}"></div>
    </div>
    <div class="field">
      <label class="label">Additional Instructions</label>
      <textarea class="textarea mono" id="ed-extra" rows="4" placeholder="Appended to system prompt...">${esc(a.system_prompt_extra||'')}</textarea>
      <div class="hint">This text is appended to the composed system prompt for this agent.</div>
    </div>

    <div class="section-title">Skills</div>
    <div class="check-grid" id="ed-skills"></div>

    <div class="section-title">Tools</div>
    <div id="ed-tools"></div>
    <div style="display:flex;gap:6px;margin-top:8px">
      <input class="input" id="ed-tool-new" placeholder="Tool name" style="max-width:240px">
      <button class="btn btn-sm" id="ed-tool-add">+ Add</button>
    </div>

    <div class="section-title">Handoffs</div>
    <div class="check-grid" id="ed-handoffs"></div>

    <div class="save-bar">
      <span class="muted" id="ed-save-status"></span>
      <button class="btn btn-primary" id="ed-save-btn">💾 Save Changes</button>
    </div>
  `;

  // Populate responsibilities
  const respList = ed.querySelector('#ed-resp');
  function renderResps(items){
    respList.innerHTML = items.map((r,i)=>`
      <div class="resp-row"><input class="input" value="${esc(r)}" data-idx="${i}"><button class="btn-icon" data-idx="${i}" title="Remove">✕</button></div>
    `).join('');
    respList.querySelectorAll('.btn-icon').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.idx,1);renderResps(items);});
  }
  const resps = [...(a.responsibilities||[])];
  renderResps(resps);
  ed.querySelector('#ed-resp-add').onclick=()=>{resps.push('');renderResps(resps);respList.querySelector('.resp-row:last-child input')?.focus();};

  // Model override toggle
  ed.querySelector('#ed-model-override').onchange = function(){ ed.querySelector('#ed-model-fields').classList.toggle('hidden',!this.checked); };
  // Populate model fields if override exists
  if(hasOverride){
    ed.querySelector('#ed-provider').value = a.model.provider||'litellm';
    ed.querySelector('#ed-model-id').value = a.model.model_id||'';
  }

  // Populate skills
  const skillsEl = ed.querySelector('#ed-skills');
  const agentSkillIds = (a.skills||[]).map(s=>typeof s==='object'?s.id:s);
  skillsEl.innerHTML = allSkills.map(s=>{
    const checked = agentSkillIds.includes(s.id);
    return `<label class="check-item ${checked?'checked':''}">
      <input type="checkbox" value="${s.id}" ${checked?'checked':''}>
      <div class="check-item-info"><div class="check-item-name">${esc(s.name)}</div><div class="check-item-desc">${esc(s.description||'')}</div></div>
    </label>`;
  }).join('');
  skillsEl.querySelectorAll('.check-item input').forEach(inp=>{
    inp.onchange=()=>inp.closest('.check-item').classList.toggle('checked',inp.checked);
  });

  // Populate tools
  const toolsEl = ed.querySelector('#ed-tools');
  let toolsList = (a.tools||[]).map(t=>typeof t==='string'?{name:t,source:'mcp'}:{name:t.name,source:t.source||'mcp'});
  function renderTools(){
    toolsEl.innerHTML = toolsList.map((t,i)=>`
      <div class="tool-row"><span class="mono">${esc(t.name)}</span><span class="badge ${t.source==='platform'?'badge-builtin':'badge-cat'}" style="font-size:10px">${t.source}</span><button class="btn-icon" data-idx="${i}">✕</button></div>
    `).join('');
    toolsEl.querySelectorAll('.btn-icon').forEach(b=>b.onclick=()=>{toolsList.splice(+b.dataset.idx,1);renderTools();});
  }
  renderTools();
  ed.querySelector('#ed-tool-add').onclick=()=>{
    const inp = ed.querySelector('#ed-tool-new');
    const v = inp.value.trim();
    if(v){toolsList.push({name:v,source:'mcp'});renderTools();inp.value='';}
  };

  // Populate handoffs
  const handoffsEl = ed.querySelector('#ed-handoffs');
  const agentHandoffs = a.handoffs||[];
  handoffsEl.innerHTML = agents.filter(x=>x.id!==a.id).map(x=>{
    const checked = agentHandoffs.includes(x.id);
    return `<label class="check-item ${checked?'checked':''}">
      <input type="checkbox" value="${x.id}" ${checked?'checked':''}>
      <div class="check-item-info">
        <div class="check-item-name" style="display:flex;align-items:center;gap:6px">
          <span class="agent-dot" style="width:8px;height:8px;background:${x.avatar_color}"></span>${esc(x.name)}
        </div>
        <div class="check-item-desc">${esc(x.codename)} · ${x.tier}</div>
      </div>
    </label>`;
  }).join('');
  handoffsEl.querySelectorAll('.check-item input').forEach(inp=>{
    inp.onchange=()=>inp.closest('.check-item').classList.toggle('checked',inp.checked);
  });

  // Save
  ed.querySelector('#ed-save-btn').onclick = async ()=>{
    const btn = ed.querySelector('#ed-save-btn');
    btn.disabled=true; btn.innerHTML='<div class="spinner"></div> Saving...';
    // Gather responsibilities from inputs
    const respInputs = ed.querySelectorAll('#ed-resp .input');
    const finalResps = Array.from(respInputs).map(i=>i.value).filter(v=>v.trim());
    // Gather skills
    const checkedSkills = Array.from(ed.querySelectorAll('#ed-skills input:checked')).map(i=>i.value);
    // Gather handoffs
    const checkedHandoffs = Array.from(ed.querySelectorAll('#ed-handoffs input:checked')).map(i=>i.value);

    const body = {
      name: ed.querySelector('#ed-name').value,
      name_vi: ed.querySelector('#ed-name-vi').value,
      codename: ed.querySelector('#ed-codename').value,
      description: ed.querySelector('#ed-desc').value,
      persona: ed.querySelector('#ed-persona').value,
      responsibilities: finalResps,
      icon: ed.querySelector('#ed-icon').value,
      avatar_color: ed.querySelector('#ed-color').value,
      enabled: ed.querySelector('#ed-enabled').checked,
      autonomy_cap: ed.querySelector('input[name="autonomy"]:checked')?.value || 'autonomous',
      temperature: ed.querySelector('#ed-temp').value ? parseFloat(ed.querySelector('#ed-temp').value) : null,
      max_tokens: ed.querySelector('#ed-max-tok').value ? parseInt(ed.querySelector('#ed-max-tok').value) : null,
      system_prompt_extra: ed.querySelector('#ed-extra').value,
      skills: checkedSkills,
      tools: toolsList.map(t=>t.name),
      handoffs: checkedHandoffs,
    };

    // Model override
    const override = ed.querySelector('#ed-model-override').checked;
    if(override){
      body.model_override = {
        provider: ed.querySelector('#ed-provider').value,
        model_id: ed.querySelector('#ed-model-id').value,
      };
      const ak = ed.querySelector('#ed-api-key').value;
      if(ak) body.model_override.api_key = ak;
      const bu = ed.querySelector('#ed-base-url').value;
      if(bu) body.model_override.base_url = bu;
    } else {
      body.clear_model_override = true;
    }

    try {
      await apiFetch('/agents/'+a.id,{method:'PATCH',body:JSON.stringify(body)});
      toast('Agent saved successfully');
      ed.querySelector('#ed-save-status').textContent = 'Saved at '+new Date().toLocaleTimeString();
      // Refresh agent list
      const agData = await apiFetch('/agents');
      agents = agData.items||[];
      renderAgentList();
    } catch(e){ toast(e.message,'error'); }
    btn.disabled=false; btn.innerHTML='💾 Save Changes';
  };
}

// ── Skills Library ────────────────────────────────────────
function renderSkills(){
  const grid = document.getElementById('skills-grid');
  const editorWrap = document.getElementById('skill-editor-wrap');
  const content = document.getElementById('skills-content');
  const q = (document.getElementById('skill-search').value||'').toLowerCase();
  const filtered = allSkills.filter(s=> !q || s.name.toLowerCase().includes(q) || (s.description||'').toLowerCase().includes(q) || s.id.includes(q));
  grid.innerHTML = filtered.map(s=>`
    <div class="card skill-card" data-id="${s.id}">
      <div class="skill-card-title">${esc(s.name)} ${s.builtin?'<span class="badge badge-builtin">built-in</span>':'<span class="badge badge-custom">custom</span>'}</div>
      <div class="skill-card-desc">${esc(s.description||'')}</div>
      <div class="skill-card-footer">
        <span class="badge badge-cat">${esc(s.category||'general')}</span>
        ${(s.used_by||[]).length?`<span class="muted small">${s.used_by.length} agent(s)</span>`:''}
      </div>
    </div>
  `).join('');
  grid.querySelectorAll('.skill-card').forEach(c=>{ c.onclick=()=>openSkillEditor(c.dataset.id); });
  content.classList.remove('hidden');
  editorWrap.classList.add('hidden');
}
document.getElementById('skill-search').oninput = renderSkills;
document.getElementById('skill-create-btn').onclick = ()=> openSkillEditor(null);

async function openSkillEditor(id){
  const content = document.getElementById('skills-content');
  const wrap = document.getElementById('skill-editor-wrap');
  content.classList.add('hidden');
  wrap.classList.remove('hidden');
  let skill = {id:'',name:'',description:'',category:'general',standards:[],tools:[],body_md:''};
  const isNew = !id;
  if(!isNew){
    try { skill = await apiFetch('/skills/'+id); } catch(e){ toast(e.message,'error'); return; }
  }
  wrap.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <button class="btn btn-sm" id="sk-back">← Back</button>
      <h3>${isNew?'Create Skill':'Edit: '+esc(skill.name)}</h3>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="field"><label class="label">ID (kebab-case)</label><input class="input mono" id="sk-id" value="${esc(skill.id)}" ${isNew?'':'readonly'} placeholder="my-skill-name"></div>
      <div class="field"><label class="label">Name</label><input class="input" id="sk-name" value="${esc(skill.name)}"></div>
    </div>
    <div class="field"><label class="label">Description</label><textarea class="textarea" id="sk-desc" rows="2">${esc(skill.description||'')}</textarea></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="field"><label class="label">Category</label>
        <select class="select" id="sk-cat">
          ${['general','triage','investigation','response','detection','threat-intel','compliance','platform','reporting'].map(c=>`<option ${skill.category===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label class="label">Standards (comma-separated)</label><input class="input" id="sk-stds" value="${(skill.standards||[]).join(', ')}"></div>
    </div>
    <div class="field"><label class="label">Tools (comma-separated)</label><input class="input mono" id="sk-tools" value="${(skill.tools||[]).join(', ')}"></div>
    <div class="field">
      <label class="label">Instructions (Markdown)</label>
      <textarea class="textarea mono" id="sk-body" rows="18" style="min-height:300px">${esc(skill.body_md||'')}</textarea>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" id="sk-save">${isNew?'Create':'Save'}</button>
      <button class="btn" id="sk-cancel">Cancel</button>
    </div>
  `;
  wrap.querySelector('#sk-back').onclick = wrap.querySelector('#sk-cancel').onclick = ()=>{
    wrap.classList.add('hidden'); content.classList.remove('hidden'); renderSkills();
  };
  wrap.querySelector('#sk-save').onclick = async ()=>{
    const body = {
      name: wrap.querySelector('#sk-name').value,
      description: wrap.querySelector('#sk-desc').value,
      category: wrap.querySelector('#sk-cat').value,
      standards: wrap.querySelector('#sk-stds').value.split(',').map(s=>s.trim()).filter(Boolean),
      tools: wrap.querySelector('#sk-tools').value.split(',').map(s=>s.trim()).filter(Boolean),
      body_md: wrap.querySelector('#sk-body').value,
    };
    if(isNew) body.id = wrap.querySelector('#sk-id').value;
    try {
      if(isNew) await apiFetch('/skills',{method:'POST',body:JSON.stringify(body)});
      else await apiFetch('/skills/'+id,{method:'PUT',body:JSON.stringify(body)});
      toast(isNew?'Skill created':'Skill saved');
      const skData = await apiFetch('/skills');
      allSkills = skData.items||[];
      wrap.classList.add('hidden'); content.classList.remove('hidden'); renderSkills();
    } catch(e){ toast(e.message,'error'); }
  };
}

// ── Prompt Preview ────────────────────────────────────────
function renderPreviewSelector(){
  const sel = document.getElementById('preview-agent');
  sel.innerHTML = '<option value="">— Select agent —</option>' + agents.map(a=>`<option value="${a.id}">${esc(a.name)} (${a.codename})</option>`).join('');
}
document.getElementById('preview-agent').onchange = async function(){
  const content = document.getElementById('preview-content');
  if(!this.value){ content.innerHTML=''; return; }
  content.innerHTML='<div class="loading-full"><div class="spinner"></div>&nbsp; Loading prompt...</div>';
  try {
    const data = await apiFetch('/agents/'+this.value+'/prompt');
    content.innerHTML = `
      <div class="card" style="margin-top:12px">
        <div class="card-header">System Prompt <span class="muted small">${data.system_prompt.length.toLocaleString()} chars</span></div>
        <div class="preview-prompt">${escHtml(data.system_prompt)}</div>
      </div>
      <div class="card" style="margin-top:12px">
        <div class="card-header">Skills Injected</div>
        <div class="preview-chips">${(data.skills_injected||[]).map(s=>'<span class="chip">'+esc(s)+'</span>').join('')}</div>
      </div>
      <div class="card" style="margin-top:12px">
        <div class="card-header">Tool Specs <span class="muted small">${data.tools.length} tools</span></div>
        <div style="max-height:300px;overflow-y:auto">
          ${data.tools.map(t=>`<div class="tool-row"><span class="mono">${esc(t.name)}</span><span class="badge ${t.source==='platform'?'badge-builtin':'badge-cat'}" style="font-size:10px">${t.source}</span></div>`).join('')}
        </div>
      </div>
    `;
  } catch(e){ content.innerHTML='<div class="empty"><p>'+esc(e.message)+'</p></div>'; }
};

// ── Helpers ───────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escHtml(s){
  // Simple markdown-ish highlighting for the preview
  return esc(s).replace(/^(## .+)$/gm,'<b style="color:var(--accent)">$1</b>')
    .replace(/^(- .+)$/gm,'<span style="color:var(--info)">$1</span>')
    .replace(/`([^`]+)`/g,'<code style="background:var(--card2);padding:1px 4px;border-radius:3px">$1</code>');
}
function togglePw(id,btn){ const inp=document.getElementById(id); if(inp.type==='password'){inp.type='text';btn.textContent='hide';}else{inp.type='password';btn.textContent='show';} }

// ── Init ──────────────────────────────────────────────────
(function init(){
  const t = getToken();
  if(t){ token=t; showApp(); loadAll(); apiFetch('/auth/me').then(u=>{document.getElementById('user-label').textContent=u.name||u.email||'';}).catch(()=>{clearToken();showLogin();}); }
  else showLogin();
})();
</script>
