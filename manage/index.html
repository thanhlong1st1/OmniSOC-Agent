    <style>
      /* ═══════════════════════════════════════════════════════
         WIBU THEME — Rem (Re:Zero) anime glassmorphism
         ═══════════════════════════════════════════════════════ */
      [data-theme="wibu"] {
        --bg: 16 14 42;
        --deep: 10 8 30;
        --card: 20 18 55;
        --card2: 30 26 70;
        --line: 70 65 130;
        --fg: 232 230 245;
        --muted: 155 148 185;
        --subtle: 110 104 150;
        --accent: 130 160 255;
        --danger: 239 68 68;
        --success: 34 197 94;
        --info: 129 140 248;
        --warn: 251 191 36;
        --glow: 130 160 255;
        color-scheme: dark;
      }

      /* Background image */
      [data-theme="wibu"] body {
        background-image: url('/assets/rem-wibu-bg.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
      }

      /* Dark overlay for readability */
      [data-theme="wibu"] body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: linear-gradient(
          135deg,
          rgba(10, 8, 35, 0.78) 0%,
          rgba(16, 12, 45, 0.65) 35%,
          rgba(12, 10, 40, 0.55) 60%,
          rgba(10, 8, 35, 0.45) 100%
        );
      }

      /* All direct children above overlay */
      [data-theme="wibu"] body > * {
        position: relative;
        z-index: 1;
      }

      /* Glassmorphism for main containers */
      [data-theme="wibu"] [class*="bg-card"],
      [data-theme="wibu"] [class*="bg-deep"],
      [data-theme="wibu"] .rounded-xl[class*="border"],
      [data-theme="wibu"] [class*="bg-card2"] {
        backdrop-filter: blur(12px) saturate(1.2);
        -webkit-backdrop-filter: blur(12px) saturate(1.2);
      }

      /* Sidebar glass effect */
      [data-theme="wibu"] aside,
      [data-theme="wibu"] nav,
      [data-theme="wibu"] [class*="sidebar"],
      [data-theme="wibu"] [class*="w-60"],
      [data-theme="wibu"] [class*="w-64"] {
        backdrop-filter: blur(16px) saturate(1.3);
        -webkit-backdrop-filter: blur(16px) saturate(1.3);
        background-color: rgba(16, 12, 45, 0.6) !important;
        border-color: rgba(100, 90, 180, 0.2) !important;
      }

      /* Header/topbar glass */
      [data-theme="wibu"] header,
      [data-theme="wibu"] [class*="sticky"][class*="top-0"],
      [data-theme="wibu"] [class*="h-12"][class*="border-b"],
      [data-theme="wibu"] [class*="h-14"][class*="border-b"] {
        backdrop-filter: blur(20px) saturate(1.3);
        -webkit-backdrop-filter: blur(20px) saturate(1.3);
        background-color: rgba(12, 8, 38, 0.7) !important;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.25);
      }

      /* Card glass effect */
      [data-theme="wibu"] [class*="rounded-xl"][class*="border"][class*="p-"] {
        backdrop-filter: blur(14px) saturate(1.2);
        -webkit-backdrop-filter: blur(14px) saturate(1.2);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15),
                    inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      /* Input fields */
      [data-theme="wibu"] input.input,
      [data-theme="wibu"] textarea.input,
      [data-theme="wibu"] select.select,
      [data-theme="wibu"] [class*="input"][class*="border"] {
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }

      /* Primary button gradient */
      [data-theme="wibu"] .btn-primary,
      [data-theme="wibu"] [class*="btn-primary"] {
        background: linear-gradient(135deg, rgb(99 102 241), rgb(129 140 248)) !important;
        border-color: rgba(129, 140, 248, 0.4) !important;
        color: #fff !important;
      }
      [data-theme="wibu"] .btn-primary:hover,
      [data-theme="wibu"] [class*="btn-primary"]:hover {
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.35);
      }

      /* Active navigation items glow */
      [data-theme="wibu"] [class*="text-accent"] {
        text-shadow: 0 0 12px rgba(130, 160, 255, 0.3);
      }

      /* Tables & data grids */
      [data-theme="wibu"] table {
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      /* Badge accents - softer blue/purple */
      [data-theme="wibu"] [class*="bg-accent"] {
        background-color: rgba(99, 102, 241, 0.15) !important;
      }

      /* Scrollbar for wibu theme */
      [data-theme="wibu"] ::-webkit-scrollbar-thumb {
        background: rgba(130, 160, 255, 0.3);
        border-radius: 4px;
      }
      [data-theme="wibu"] ::-webkit-scrollbar-track {
        background: rgba(16, 12, 45, 0.3);
      }

      /* Subtle animation for theme switcher button */
      [data-theme="wibu"] [class*="ring-line"] {
        box-shadow: 0 0 8px rgba(130, 160, 255, 0.2);
      }

      /* Dialog/modal glass */
      [data-theme="wibu"] [role="dialog"],
      [data-theme="wibu"] [class*="fixed"][class*="inset"] [class*="rounded-xl"] {
        backdrop-filter: blur(20px) saturate(1.4);
        -webkit-backdrop-filter: blur(20px) saturate(1.4);
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4),
                    inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      /* Login page full glass */
      [data-theme="wibu"] [class*="flex"][class*="min-h-screen"][class*="items-center"] > div {
        backdrop-filter: blur(24px) saturate(1.3);
        -webkit-backdrop-filter: blur(24px) saturate(1.3);
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35);
      }

      /* Dropdown menus */
      [data-theme="wibu"] [class*="absolute"][class*="rounded"][class*="shadow"] {
        backdrop-filter: blur(16px) saturate(1.3);
        -webkit-backdrop-filter: blur(16px) saturate(1.3);
      }

      /* Chip/tag styles */
      [data-theme="wibu"] [class*="rounded-full"][class*="px-"],
      [data-theme="wibu"] [class*="rounded-lg"][class*="text-xs"] {
        border-color: rgba(130, 160, 255, 0.15);
      }

      /* Toast notifications */
      [data-theme="wibu"] [class*="toast"],
      [data-theme="wibu"] [class*="Toastify"] {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
    </style>
  </head>

    <div id="root"></div>
  </body>
</html>
